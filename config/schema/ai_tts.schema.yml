ai_tts.settings:
  type: config_object
  label: 'AI TTS settings'
  mapping:
    koko_binary_path:
      type: string
      label: 'Path to koko binary'
    default_voice:
      type: string
      label: 'Default voice'
    default_speed:
      type: string
      label: 'Default speech speed'
    cache_audio:
      type: boolean
      label: 'Cache generated audio files'
    audio_directory:
      type: string
      label: 'Audio cache directory'
    cache_size_limit_enabled:
      type: boolean
      label: 'Enable size-based cache cleanup'
    cache_max_size:
      type: integer
      label: 'Maximum cache size in bytes'
    cache_content_tracking_enabled:
      type: boolean
      label: 'Enable content-based cache invalidation'
    max_text_length:
      type: integer
      label: 'Maximum text length in characters (0 for unlimited)'
    generation_timeout:
      type: integer
      label: 'Maximum generation timeout in seconds'
    rate_limit_enabled:
      type: boolean
      label: 'Enable rate limiting'
    rate_limit_threshold:
      type: integer
      label: 'Maximum requests per hour per user'
