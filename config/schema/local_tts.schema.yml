local_tts.settings:
  type: config_object
  label: 'Local TTS settings'
  mapping:
    espeak_data_path:
      type: string
      label: 'Path to espeak-ng-data directory'
    default_voice:
      type: string
      label: 'Default voice'
    default_speed:
      type: string
      label: 'Default speech speed'
    default_voices:
      type: mapping
      label: 'Default voices per language'
    cache_audio:
      type: boolean
      label: 'Cache generated audio files'
    audio_directory:
      type: string
      label: 'Audio cache directory'
    cache_size_limit_enabled:
      type: boolean
      label: 'Enable size-based cache cleanup'
    cache_max_size:
      type: integer
      label: 'Maximum cache size in bytes'
    max_text_length:
      type: integer
      label: 'Maximum text length in characters (0 for unlimited)'
    max_server_load:
      type: float
      label: 'Maximum server load threshold'
    generation_timeout:
      type: integer
      label: 'Maximum generation timeout in seconds'
    rate_limit_enabled:
      type: boolean
      label: 'Enable rate limiting'
    rate_limit_threshold:
      type: integer
      label: 'Maximum requests per hour per user'
    auto_generate:
      type: boolean
      label: 'Auto-generate audio on entity save'
    allowed_bundles:
      type: mapping
      label: 'Allowed content type bundles'
    show_download:
      type: boolean
      label: 'Show download button on player'
