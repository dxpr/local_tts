site_name: 'Local Text-to-Speech - Documentation'
site_url: 'https://project.pages.drupalcode.org/local_tts/'
repo_url: https://git.drupalcode.org/project/local_tts
repo_name: drupal/local_tts
edit_uri: -/edit/1.x/docs/
exclude_docs: |
  local_tts_project_desc.html

theme:
  name: material
  features:
    - navigation.footer
    - navigation.sections

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - privacy:
      enabled: !ENV [CI, false]

nav:
  - Home: 'index.md'
  - Using Local TTS:
      - How the Player Works: 'using/how-the-player-works.md'
      - Choosing a Voice: 'using/choosing-a-voice.md'
  - Setting Up:
      - Quick Start: 'setting-up/quick-start.md'
      - Installation: 'setting-up/installation.md'
      - Configuration: 'setting-up/configuration.md'
  - Integrations:
      - Overview: 'integrations/index.md'
      - Block: 'integrations/block.md'
      - Entity Field: 'integrations/field.md'
      - Extra Field: 'integrations/extra-field.md'
      - Views Field: 'integrations/views-field.md'
  - Managing Audio:
      - Keeping Audio Current: 'managing-audio/cache.md'
      - Batch Generation: 'managing-audio/batch-generation.md'
      - Drush Commands: 'managing-audio/drush.md'
  - FAQ: 'faq.md'
  - Development:
      - Architecture: 'development/architecture.md'
      - Contributing: 'development/contributing.md'
