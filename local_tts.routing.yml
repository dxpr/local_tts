local_tts.settings:
  path: '/admin/config/media/local-tts'
  defaults:
    _form: '\Drupal\local_tts\Form\LocalTtsSettingsForm'
    _title: 'Local TTS Settings'
  requirements:
    _permission: 'administer local tts settings'

local_tts.test:
  path: '/admin/config/media/local-tts/test'
  defaults:
    _form: '\Drupal\local_tts\Form\LocalTtsTestForm'
    _title: 'Test Local TTS'
  requirements:
    _permission: 'administer local tts settings'

local_tts.batch:
  path: '/admin/config/media/local-tts/batch'
  defaults:
    _form: '\Drupal\local_tts\Form\LocalTtsBatchForm'
    _title: 'Batch TTS Generation'
  requirements:
    _permission: 'administer local tts settings'

local_tts.cache_overview:
  path: '/admin/config/media/local-tts/cache'
  defaults:
    _form: '\Drupal\local_tts\Form\TtsCacheOverviewForm'
    _title: 'Audio Cache'
  requirements:
    _permission: 'administer local tts settings'

local_tts.cache_delete:
  path: '/admin/config/media/local-tts/cache/delete/{cache_key}'
  defaults:
    _controller: '\Drupal\local_tts\Controller\TtsCacheController::deleteFile'
  requirements:
    _permission: 'administer local tts settings'
    _csrf_token: 'TRUE'

local_tts.generate:
  path: '/local-tts/generate'
  defaults:
    _controller: '\Drupal\local_tts\Controller\TtsController::generate'
  requirements:
    _permission: 'generate local tts'
  methods: [POST]
  options:
    no_cache: TRUE

local_tts.status:
  path: '/local-tts/status/{cache_key}'
  defaults:
    _controller: '\Drupal\local_tts\Controller\TtsController::status'
  requirements:
    _permission: 'generate local tts'
    cache_key: '[a-f0-9]{32}'
  options:
    no_cache: TRUE

local_tts.voice_preview:
  path: '/admin/config/media/local-tts/preview'
  defaults:
    _controller: '\Drupal\local_tts\Controller\VoicePreviewController::preview'
  requirements:
    _permission: 'administer local tts settings'
  options:
    no_cache: TRUE
