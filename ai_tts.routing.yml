ai_tts.settings:
  path: '/admin/config/media/ai-tts'
  defaults:
    _form: '\Drupal\ai_tts\Form\AiTtsSettingsForm'
    _title: 'AI TTS Settings'
  requirements:
    _permission: 'administer ai tts settings'

ai_tts.test:
  path: '/admin/config/media/ai-tts/test'
  defaults:
    _form: '\Drupal\ai_tts\Form\AiTtsTestForm'
    _title: 'Test AI TTS'
  requirements:
    _permission: 'administer ai tts settings'

ai_tts.generate:
  path: '/ai-tts/generate'
  defaults:
    _controller: '\Drupal\ai_tts\Controller\TtsController::generate'
  requirements:
    _permission: 'generate ai tts'
  options:
    no_cache: TRUE
